[package]
name = "healthcare-billing-sim"
version = "0.1.0"
edition = "2024"
default-run = "healthcare-billing-sim"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `test-util` is required in the main dependency set: the simulation binary itself
# runs under a paused-clock runtime (Builder::start_paused), not just the tests.
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "generate-claims"
path = "src/bin/generate_claims.rs"
