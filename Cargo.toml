[package]
name = "healthcare-billing-sim"
version = "0.1.0"
edition = "2024"
default-run = "healthcare-billing-sim"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multi-thread runtime: time is computed, not slept (Decisions #23), so the
# simulation runs on the stock scheduler with claim tasks in true parallel.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
ratatui = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "generate-claims"
path = "src/bin/generate_claims.rs"
